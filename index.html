<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>Tracks</title>
<style>
:root{color-scheme:light;--bg:#e8eeeb;--card:rgba(250,251,248,.84);--fg:#172522;--mut:#52635b;--line:rgba(43,65,57,.16);--acc:#315e55;--on:#f8faf6;--bar:rgba(240,245,240,.76);--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 85% 4%,rgba(255,255,255,.72),transparent 34%),linear-gradient(155deg,#dce6e1 0%,#edf0e9 48%,#e7ddd0 100%);color:var(--fg);font:16px/1.4 -apple-system,system-ui,"SF Pro Text","Helvetica Neue",sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:0 20px}
nav{display:flex;align-items:center;gap:18px;height:50px}
nav i{flex:1}
nav button,nav label{color:var(--acc);font-size:15px;padding:8px 12px;border-radius:22px;background:rgba(255,255,255,.38)}
h1{margin:6px 0 16px;font-size:34px;line-height:1.06;font-weight:650;letter-spacing:-1.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;color:inherit;background:none;border:0;padding:8px;cursor:pointer;touch-action:manipulation;transition:opacity .16s ease,transform .16s var(--ease),background-color .2s ease}
button:active,nav label:active{opacity:.55;transform:scale(.96)}
button:focus-visible,input:focus-visible,nav label:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
[hidden]{display:none!important}
#cv:empty{display:none}
#cv img{width:min(48vw,230px);height:min(48vw,230px);object-fit:cover;border-radius:25px;display:block;margin:0 auto 18px;box-shadow:0 16px 42px rgba(40,57,48,.18);animation:arrive .32s var(--ease) both}
#list{flex:1;overflow:auto;margin:0;padding:0 16px 20px;list-style:none;-webkit-overflow-scrolling:touch;align-content:start}
li{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:12px 14px;min-height:72px;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background-color .18s ease,transform .18s var(--ease);animation:arrive .24s var(--ease) both}
li+li{border-top:.5px solid var(--line)}
li:first-child{border-radius:20px 20px 0 0}
li:last-child{border-radius:0 0 20px 20px}
li:only-child{border-radius:20px}
li:active{background:var(--line)}
#list:not(.ed) li[data-l]::after{content:'›';margin-left:auto;color:var(--mut);font-size:24px;line-height:1}
.n{width:28px;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a{display:block;font-size:13px;font-weight:400;color:var(--mut)}
.cv{width:56px;height:56px;border-radius:15px;background:linear-gradient(145deg,#bbc9be,#e1c9b2);overflow:hidden;flex:none;margin-right:8px;box-shadow:0 4px 12px rgba(40,57,48,.1)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.np .cv{width:44px;height:44px;margin:0}
li.on .t{font-weight:700;color:var(--acc)}
li.on .n{color:var(--acc)}
.b{flex-basis:100%;padding-left:28px}
.b button{color:var(--acc);font-size:15px;padding:6px 12px 6px 0}
li.empty{display:block;min-height:0;background:none;border:0;color:var(--mut);text-align:center;padding:40px 24px}
footer{margin:0 10px calc(8px + env(safe-area-inset-bottom));padding:12px 18px 8px;border-radius:28px;background:var(--bar);-webkit-backdrop-filter:blur(24px) saturate(1.35);backdrop-filter:blur(24px) saturate(1.35);box-shadow:0 0 0 .5px rgba(255,255,255,.7),0 12px 36px rgba(48,64,55,.16);transition:box-shadow .25s ease,background-color .25s ease}
.np{display:flex;align-items:center;gap:12px}
#now{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now,#art{cursor:pointer}
#seek{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:8px 0 0}
#seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--acc) var(--p,0%),var(--line) 0)}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.22);transition:transform .15s ease}
#seek:active::-webkit-slider-thumb{transform:scale(1.2)}
#tm{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;padding:2px 6px}
.ctl button{color:var(--fg);width:48px;height:48px;display:grid;place-items:center;padding:0}
.ctl button.on{color:var(--acc)}
#pp{width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--on);box-shadow:0 6px 14px rgba(49,94,85,.24)}
.ctl button:not(#pp){width:50px;height:50px;border:1px solid rgba(49,75,65,.26);border-radius:50%;background:rgba(255,255,255,.18)}
#welcome{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;padding:calc(24px + env(safe-area-inset-top)) 24px calc(22px + env(safe-area-inset-bottom));overflow:auto;background:radial-gradient(ellipse at 73% 31%,rgba(236,220,194,.52),transparent 35%),radial-gradient(ellipse at 16% 78%,rgba(151,178,164,.42),transparent 35%),linear-gradient(155deg,#839b94 0%,#bcc9bd 45%,#e5d7c4 100%);color:#f8f8f2}
.welcome-mark{font-size:14px;letter-spacing:.23em;text-transform:uppercase;opacity:.88}
.welcome-art{flex:1;min-height:150px;display:grid;place-items:center;position:relative}
.welcome-disc{width:min(66vw,300px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.72),rgba(238,231,214,.24) 38%,rgba(52,80,72,.24) 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 28px 65px rgba(40,57,48,.16);display:grid;place-items:center;overflow:hidden;animation:float 5s ease-in-out infinite}
.welcome-disc svg{width:43%;height:43%;filter:drop-shadow(0 8px 12px rgba(31,52,45,.16))}
.welcome-disc.has-art{width:min(72vw,340px);aspect-ratio:4/5;border-radius:26px;background:none;box-shadow:0 24px 60px rgba(25,42,37,.26)}
.welcome-disc img{display:block;width:100%;height:100%;object-fit:cover}
.welcome-art-actions{position:absolute;right:0;bottom:0;display:flex;gap:8px}
.welcome-art-actions button{border:1px solid rgba(255,255,255,.58);border-radius:22px;background:rgba(38,55,48,.25);color:white;padding:8px 12px;font-size:13px;backdrop-filter:blur(12px)}
.welcome-copy{padding-bottom:26px;text-shadow:0 1px 14px rgba(40,57,48,.1)}
.welcome-kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.82}
.welcome-copy h2{font-size:clamp(42px,12vw,64px);line-height:.98;letter-spacing:-2px;margin:12px 0 14px;font-weight:650}
.welcome-copy p{font-size:17px;max-width:310px;opacity:.9;margin:0}
.welcome-actions{display:flex;gap:12px}
.welcome-actions button{flex:1;border-radius:28px;padding:15px 16px;font-size:15px}
#welcomeStart{background:#f7f6ef;color:#263b34}
#welcomeImport{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.13);color:white}
#playerScreen{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow:auto;color:#fff;background:linear-gradient(180deg,rgba(22,39,35,.24),rgba(22,39,35,.42)),var(--player-cover,radial-gradient(ellipse at 50% 22%,#c7d1c9,#748a80 60%,#425b51));background-size:cover;background-position:center}
#playerScreen[hidden]{display:none!important}
.player-top{display:flex;align-items:center;justify-content:space-between;height:48px}
.player-top button,.player-round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(12px)}
.player-label{font-size:15px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.2)}
.player-art-wrap{flex:1;display:grid;place-items:center;min-height:180px;padding:20px 0}
.player-art{width:min(78vw,390px);aspect-ratio:1;border-radius:26px;object-fit:cover;box-shadow:0 24px 60px rgba(0,0,0,.25);background:linear-gradient(145deg,#bac9be,#d9c1a7)}
.player-bottom{padding-bottom:8px}
.player-title-row{display:flex;align-items:end;gap:16px;margin-bottom:20px}
.player-title{flex:1;min-width:0}.player-title h2{font-size:clamp(32px,9vw,46px);letter-spacing:-1.5px;line-height:1;margin:0 0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player-title p{margin:0;font-size:16px;opacity:.86;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-extras{display:flex;gap:8px}.player-extras button{border:0;background:transparent;color:#fff;opacity:.9}.player-extras button.on{color:#d6e7dc}
.player-seek{width:100%;accent-color:#f8f8f2;margin:0;height:22px}.player-times{font-size:12px;opacity:.82;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;margin-top:4px}
.player-transport{display:flex;align-items:center;justify-content:space-between;margin-top:20px;gap:12px}.player-transport button{width:min(29vw,76px);height:min(29vw,76px);border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.65);backdrop-filter:blur(12px)}.player-transport #playerToggle{width:min(32vw,84px);height:min(32vw,84px);background:rgba(255,255,255,.17)}
body.playing>header,body.playing>#cv,body.playing>#list,body.playing>footer{visibility:hidden}
@keyframes float{50%{transform:translateY(-9px)}}
@media(max-height:700px){.welcome-art{min-height:120px}.welcome-disc{width:min(45vh,230px)}.welcome-copy h2{font-size:42px}}
@media(max-height:700px){.welcome-disc.has-art{width:min(42vh,220px)}}
@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<section id="welcome" hidden aria-label="Welcome to Tracks">
 <div class="welcome-mark">Tracks · your music, your space</div>
 <div class="welcome-art"><div class="welcome-disc" id="welcomeDisc"><svg viewBox="0 0 120 120" fill="none"><path d="M26 60h8m6-17v34m16-49v64m18-46v28m16-44v60m16-39v18" stroke="#f8f8f2" stroke-width="8" stroke-linecap="round"/><circle cx="60" cy="60" r="51" stroke="rgba(248,248,242,.38)" stroke-width="1.5"/></svg></div><div class="welcome-art-actions"><button id="welcomeArtworkBtn" type="button">Add artwork</button><button id="welcomeArtworkRemove" type="button" hidden>Remove</button></div></div>
 <div class="welcome-copy"><div class="welcome-kicker">A little room to listen</div><h2>Make space<br>for sound.</h2><p>Your music stays yours. Add a few tracks and settle in.</p></div>
 <div class="welcome-actions"><button id="welcomeStart">Start listening</button><button id="welcomeImport">Add music</button></div>
</section>
<input id="welcomeArtworkFile" type="file" accept="image/*" hidden>
<header><nav><button id="bk" hidden>‹ Tracks</button><i></i><button id="changeArt" aria-label="Change welcome artwork">Art</button><button id="ed">Edit</button><button id="nw">New</button><label id="ad" role="button" tabindex="0" aria-label="Add audio tracks">Add<input id="f" type="file" accept="audio/*,.mp3,.m4a,.m4b,.mp4,.aac,.wav,.aif,.aiff,.caf,.flac" multiple hidden></label></nav><h1 id="h">Tracks</h1></header>
<div id="cv"></div>
<ul id="list" aria-label="Your playlists"></ul>
<input id="cf" type="file" accept="image/*" hidden>
<footer aria-label="Audio player">
<div class="np"><span class="cv" id="art" role="button" tabindex="0" aria-label="Open now playing"></span><div id="now" role="button" tabindex="0" aria-label="Open now playing" aria-live="polite">Nothing playing</div></div>
<input id="seek" type="range" min="0" max="1000" value="0">
<div id="tm">0:00 / 0:00<span style="float:right">v10</span></div>
<div class="ctl"><button id="sh" aria-label="Shuffle"></button><button id="pv" aria-label="Previous"></button><button id="pp" aria-label="Play or pause"></button><button id="nx" aria-label="Next"></button><button id="rp" aria-label="Repeat"></button></div>
</footer>
<section id="playerScreen" hidden role="dialog" aria-modal="true" aria-labelledby="playerTitle">
 <div class="player-top"><button id="playerBack" aria-label="Back to library">‹</button><span class="player-label">NOW PLAYING</span><button aria-label="Close player" id="playerClose">×</button></div>
 <div class="player-art-wrap"><img class="player-art" id="playerArt" alt=""></div>
 <div class="player-bottom"><div class="player-title-row"><div class="player-title"><h2 id="playerTitle" aria-live="polite">Nothing playing</h2><p id="playerArtist">Tracks</p></div><div class="player-extras"><button class="player-round" id="playerShuffle" aria-label="Shuffle" aria-pressed="false"></button><button class="player-round" id="playerRepeat" aria-label="Repeat off" aria-pressed="false"></button></div></div>
 <input class="player-seek" id="playerSeek" type="range" min="0" max="1000" value="0" aria-label="Track position"><div class="player-times"><span id="playerElapsed">0:00</span><span id="playerDuration">0:00</span></div>
 <div class="player-transport"><button id="playerPrev" aria-label="Previous track"></button><button id="playerToggle" aria-label="Play or pause"></button><button id="playerNext" aria-label="Next track"></button></div></div>
</section>
<audio id="au" preload="auto"></audio>
<script>
const $=s=>document.querySelector(s),au=$('#au');
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
let db,all=[],lists=[],cov={},lv=null,pl=null,pid=null,cid=null,shuf=false,rep=0,edit=false,url=null,drag=false,playToken=0,welcomeArtworkUrl=null;
const esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const inList=l=>all.filter(t=>(t.list||'')===l).sort((a,b)=>a.order-b.order);
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('tracks',2);
 r.onupgradeneeded=()=>{const d=r.result;for(const [n,o] of [['meta',{keyPath:'id'}],['lists',{keyPath:'id'}],['blob']])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,o)};
 r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const run=(st,mode,fn)=>new Promise((ok,no)=>{const t=db.transaction(st,mode);let r;
 try{r=fn(...st.map(s=>t.objectStore(s)))}catch(x){no(x);return}
 t.oncomplete=()=>ok(r&&r.result);t.onerror=t.onabort=()=>no(t.error)});

async function load(){
 all=await run(['meta'],'readonly',m=>m.getAll());
 lists=(await run(['lists'],'readonly',l=>l.getAll())).sort((a,b)=>a.order-b.order);
 const welcomeBlob=await run(['blob'],'readonly',s=>s.get('welcome-art'));
 if(welcomeBlob)applyWelcomeArtwork(URL.createObjectURL(welcomeBlob));
 for(const l of lists)if(!cov[l.id]){const b=await run(['blob'],'readonly',s=>s.get('c:'+l.id));if(b)cov[l.id]=URL.createObjectURL(b)}
 render();
}
function applyWelcomeArtwork(nextUrl){
 if(welcomeArtworkUrl&&welcomeArtworkUrl!==nextUrl)URL.revokeObjectURL(welcomeArtworkUrl);
 welcomeArtworkUrl=nextUrl||null;
 const disc=$('#welcomeDisc');
 disc.classList.toggle('has-art',!!welcomeArtworkUrl);
 disc.querySelector('img')?.remove();
 const svg=disc.querySelector('svg');if(svg)svg.hidden=!!welcomeArtworkUrl;
 if(welcomeArtworkUrl){const img=new Image();img.alt='';img.src=welcomeArtworkUrl;disc.append(img)}
 $('#welcomeArtworkBtn').textContent=welcomeArtworkUrl?'Change artwork':'Add artwork';
 $('#welcomeArtworkRemove').hidden=!welcomeArtworkUrl;
}
async function saveWelcomeArtwork(file){
 if(!file)return;
 await run(['blob'],'readwrite',s=>s.put(file,'welcome-art'));
 applyWelcomeArtwork(URL.createObjectURL(file));
}
function render(){
 const home=lv===null,L=home?null:lv===''?{name:'Unsorted'}:lists.find(x=>x.id===lv);
 if(!home&&!L){lv=null;return render()}
 $('#h').textContent=home?'Tracks':L.name;
 $('#list').setAttribute('aria-label',home?'Your playlists':`Tracks in ${L.name}`);
 $('#bk').hidden=home;$('#nw').hidden=!home;
 $('#ed').textContent=edit?'Done':'Edit';
 $('#cv').innerHTML=!home&&cov[lv]?`<img src="${cov[lv]}">`:'';
 if(home){
  const rows=[...lists,...(inList('').length?[{id:'',name:'Unsorted'}]:[])];
  $('#list').innerHTML=rows.map(l=>`<li data-l="${l.id}" role="${edit?'group':'button'}" tabindex="${edit?'-1':'0'}" aria-label="${esc(l.name)}, ${inList(l.id).length} tracks"><span class="cv">${cov[l.id]?`<img src="${cov[l.id]}" alt="">`:''}</span><span class="t">${esc(l.name)}<span class="a">${inList(l.id).length} tracks</span></span>${edit&&l.id?'<span class="b"><button data-a="cov">Cover</button><button data-a="ren">Rename</button><button data-a="del">Delete</button></span>':''}</li>`).join('')||'<li class="empty">Tap “New” to make a playlist.</li>';
 }else{
  $('#list').innerHTML=inList(lv).map((t,i)=>`<li data-i="${i}" class="${t.id===pid&&lv===pl?'on':''}" role="${edit?'group':'button'}" tabindex="${edit?'-1':'0'}" aria-label="${esc(t.name)}${t.author?`, by ${esc(t.author)}`:''}${t.id===pid&&lv===pl?', currently playing':''}" ${t.id===pid&&lv===pl?'aria-current="true"':''}><span class="cv">${cov[t.list]?`<img src="${cov[t.list]}" alt="">`:''}</span><span class="t">${esc(t.name)}${t.author?`<span class="a">${esc(t.author)}</span>`:''}</span><span class="n" aria-hidden="true">${i+1}</span>${edit?'<span class="b"><button data-a="up" aria-label="Move up">↑</button><button data-a="dn" aria-label="Move down">↓</button><button data-a="ren">Rename</button><button data-a="mv">Move</button><button data-a="del">Delete</button></span>':''}</li>`).join('')||'<li class="empty">Tap “Add” to import audio from Files.</li>';
 }
 $('#sh').className=shuf?'on':'';
 $('#rp').className=rep?'on':'';
 $('#sh').setAttribute('aria-pressed',String(shuf));$('#rp').setAttribute('aria-pressed',String(rep>0));$('#rp').setAttribute('aria-label',rep===0?'Repeat off':rep===1?'Repeat playlist':'Repeat one');
 $('#rp').innerHTML=rep===2?I.r1:I.rp;$('#list').className=edit?'ed':'';$('#art').innerHTML=cov[pl]?`<img src="${cov[pl]}">`:'';
 const c=all.find(x=>x.id===pid);
 $('#now').textContent=c?(c.author?c.author+' – ':'')+c.name:'Nothing playing';
}
function renderPlayer(){
 const c=all.find(x=>x.id===pid);if(!c)return;
 const cover=cov[c.list]||'';
 $('#playerTitle').textContent=c.name;$('#playerArtist').textContent=c.author||'Tracks';
 if(cover)$('#playerArt').src=cover;else $('#playerArt').removeAttribute('src');
 $('#playerScreen').style.setProperty('--player-cover',cover?`linear-gradient(180deg,rgba(22,39,35,.28),rgba(22,39,35,.67)),url("${cover}")`:'' );
 $('#playerToggle').innerHTML=au.paused?I.play:I.pause;
 $('#playerToggle').setAttribute('aria-label',au.paused?'Play':'Pause');
 $('#playerShuffle').innerHTML=I.sh;$('#playerShuffle').classList.toggle('on',shuf);$('#playerShuffle').setAttribute('aria-pressed',String(shuf));
 $('#playerRepeat').innerHTML=rep===2?I.r1:I.rp;$('#playerRepeat').classList.toggle('on',rep>0);$('#playerRepeat').setAttribute('aria-pressed',String(rep>0));$('#playerRepeat').setAttribute('aria-label',rep===0?'Repeat off':rep===1?'Repeat playlist':'Repeat one');
}
const openPlayer=()=>{document.body.classList.add('playing');$('#playerScreen').hidden=false;renderPlayer();$('#playerBack').focus()};
const closePlayer=()=>{document.body.classList.remove('playing');$('#playerScreen').hidden=true;$('#now').focus()};
async function newList(){
 const n=prompt('Playlist name');if(!n||!n.trim())return;
 await run(['lists'],'readwrite',l=>{l.put({id:uid(),name:n.trim(),order:Date.now()})});
 await load();
}
async function renameList(id){
 const l=lists.find(x=>x.id===id);
 const n=prompt('Playlist name',l.name);if(!n||!n.trim())return;
 await run(['lists'],'readwrite',s=>{s.put({...l,name:n.trim()})});
 await load();
}
async function delList(id){
 const l=lists.find(x=>x.id===id);
 if(!confirm(`Delete “${l.name}”? Its tracks move to Unsorted.`))return;
 const ts=inList(id);
 await run(['meta','lists','blob'],'readwrite',(m,s,b)=>{ts.forEach(t=>m.put({...t,list:''}));s.delete(id);b.delete('c:'+id)});
 if(cov[id]){URL.revokeObjectURL(cov[id]);delete cov[id]}
 await load();
 if(ts.some(t=>t.id===pid)){pl='';setMeta(all.find(t=>t.id===pid));renderPlayer()}
}
async function setCover(id,file){
 if(!file)return;
 const bm=await createImageBitmap(file),k=Math.min(1,512/Math.max(bm.width,bm.height));
 const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
 c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
 await run(['blob'],'readwrite',s=>{s.put(b,'c:'+id)});
 if(cov[id])URL.revokeObjectURL(cov[id]);delete cov[id];
 await load();
 if(all.find(t=>t.id===pid)?.list===id){renderPlayer();setMeta(all.find(t=>t.id===pid))}
}
async function add(files){
 let o=all.reduce((m,t)=>Math.max(m,t.order),0);
 for(const f of files){
  const id=uid();
  await run(['meta','blob'],'readwrite',(m,b)=>{m.put({id,name:f.name.replace(/\.[^.]+$/,''),list:lv||'',order:++o});b.put(f,id)});
 }
 await load();
}
async function delTrack(t){
 if(!confirm(`Delete “${t.name}”?`))return;
 await run(['meta','blob'],'readwrite',(m,b)=>{m.delete(t.id);b.delete(t.id)});
 if(t.id===pid){playToken++;au.pause();au.removeAttribute('src');au.load();if(url)URL.revokeObjectURL(url);url=null;pid=null;document.body.classList.remove('playing');$('#playerScreen').hidden=true}
 await load();
}
async function renameTrack(t){
 const name=prompt('Title',t.name);if(name===null)return;
 const author=prompt('Author',t.author||'');if(author===null)return;
 await run(['meta'],'readwrite',m=>{m.put({...t,name:name.trim()||t.name,author:author.trim()})});
 await load();
 if(url&&t.id===pid)setMeta(all.find(x=>x.id===pid));
}
async function moveTrack(t){
 const o=[{id:'',name:'Unsorted'},...lists];
 const l=o[+prompt('Move to:\n'+o.map((x,i)=>`${i+1}. ${x.name}`).join('\n'))-1];if(!l)return;
 await run(['meta'],'readwrite',m=>{m.put({...t,list:l.id,order:Date.now()})});
 if(t.id===pid){pl=l.id;setMeta({...t,list:l.id})}
 await load();
 if(t.id===pid)renderPlayer();
}
async function reorder(t,d){
 const a=inList(lv),i=a.findIndex(x=>x.id===t.id),u=a[i+d];if(!u)return;
 await run(['meta'],'readwrite',m=>{m.put({...t,order:u.order});m.put({...u,order:t.order})});
 await load();
}
function setMeta(t){
 if(!('mediaSession' in navigator))return;
 navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.author||'',artwork:cov[t.list]?[{src:cov[t.list],sizes:'512x512',type:'image/jpeg'}]:[]});
}
async function play(t,l){
 if(!t)return;
 const token=++playToken;
 if(!au.getAttribute('src')){au.src=SILENT;au.play().catch(()=>{})} // unlocks audio inside the tap
 pl=l;pid=t.id;render();
 openPlayer();
 const b=await run(['blob'],'readonly',s=>s.get(t.id));
 if(token!==playToken||!b)return;
 if(url)URL.revokeObjectURL(url);
 au.src=url=URL.createObjectURL(b);
 try{await au.play()}catch(x){}
 setMeta(t);
}
const q=()=>inList(pl),ci=()=>q().findIndex(t=>t.id===pid);
function pick(d){
 const a=q(),n=a.length,c=ci();if(!n)return null;
 if(shuf&&n>1){let j;do j=Math.floor(Math.random()*n);while(j===c);return a[j]}
 const k=c+d;
 return a[k>=0&&k<n?k:rep===1?(k<0?n-1:0):-1]||null;
}
const next=()=>{const t=pick(1);if(t)play(t,pl)};
const prev=()=>{if(au.currentTime>3)au.currentTime=0;else{const t=pick(-1);if(t)play(t,pl)}};

au.onended=()=>{if(!url)return;rep===2?play(q()[ci()],pl):next()};
au.onplay=au.onpause=()=>{$('#pp').innerHTML=au.paused?I.play:I.pause;$('#pp').setAttribute('aria-label',au.paused?'Play':'Pause');$('#playerToggle').innerHTML=au.paused?I.play:I.pause;$('#playerToggle').setAttribute('aria-label',au.paused?'Play':'Pause')};
au.ontimeupdate=()=>{
 if(!url)return;
 if(!drag&&au.duration){$('#seek').value=au.currentTime/au.duration*1000;$('#seek').style.setProperty('--p',$('#seek').value/10+'%')}
 $('#tm').firstChild.textContent=fmt(au.currentTime)+' / '+fmt(au.duration);
 if(au.duration){$('#playerSeek').value=au.currentTime/au.duration*1000;$('#playerElapsed').textContent=fmt(au.currentTime);$('#playerDuration').textContent=fmt(au.duration)}
 $('#playerToggle').innerHTML=au.paused?I.play:I.pause;
 try{navigator.mediaSession.setPositionState({duration:au.duration,position:au.currentTime,playbackRate:1})}catch(x){}
};
au.onloadedmetadata=()=>{if(url){$('#tm').firstChild.textContent=fmt(au.currentTime)+' / '+fmt(au.duration)}};
$('#seek').oninput=()=>{drag=true};
$('#seek').onchange=()=>{au.currentTime=$('#seek').value/1000*au.duration;drag=false};
$('#pp').onclick=()=>url?(au.paused?au.play():au.pause()):lv!==null&&play(inList(lv)[0],lv);
$('#pv').onclick=prev;$('#nx').onclick=next;
$('#sh').onclick=()=>{shuf=!shuf;render()};
$('#rp').onclick=()=>{rep=(rep+1)%3;render()};
$('#ed').onclick=()=>{edit=!edit;render()};
$('#bk').onclick=()=>{lv=null;edit=false;render()};
$('#nw').onclick=newList;
$('#playerBack').onclick=closePlayer;$('#playerClose').onclick=closePlayer;
$('#playerToggle').onclick=()=>url&&(au.paused?au.play():au.pause());
$('#playerPrev').onclick=prev;$('#playerNext').onclick=next;
$('#playerShuffle').onclick=()=>{shuf=!shuf;render();renderPlayer()};
$('#playerRepeat').onclick=()=>{rep=(rep+1)%3;render();renderPlayer()};
$('#playerSeek').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};
$('#art').onclick=()=>{if(pid)openPlayer()};
$('#now').onclick=()=>{if(pid)openPlayer()};
for(const el of [$('#art'),$('#now')])el.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&pid){e.preventDefault();openPlayer()}};
$('#list').onkeydown=e=>{const li=e.target.closest('li[role="button"]');if(li&&(e.key==='Enter'||e.key===' ')){e.preventDefault();li.click()}};
document.addEventListener('keydown',e=>{
 if($('#playerScreen').hidden)return;
 if(e.key==='Escape'){e.preventDefault();closePlayer();return}
 if(e.key==='Tab'){
  const items=[...$('#playerScreen').querySelectorAll('button:not([disabled]),input:not([disabled])')];
  if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus()}
  else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus()}
 }
});
const leaveWelcome=()=>{ $('#welcome').hidden=true;try{localStorage.setItem('tracks-welcome-seen','1')}catch(x){} };
$('#welcomeStart').onclick=leaveWelcome;
$('#welcomeImport').onclick=()=>$('#f').click();
$('#welcomeArtworkBtn').onclick=()=>$('#welcomeArtworkFile').click();
$('#changeArt').onclick=()=>$('#welcomeArtworkFile').click();
$('#welcomeArtworkFile').onchange=async e=>{await saveWelcomeArtwork(e.target.files[0]);e.target.value=''};
$('#welcomeArtworkRemove').onclick=async()=>{await run(['blob'],'readwrite',s=>s.delete('welcome-art'));applyWelcomeArtwork(null)};
$('#ad').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#f').click()}};
$('#f').onchange=async e=>{if(e.target.files.length){leaveWelcome();await add([...e.target.files])}e.target.value=''};
$('#cf').onchange=async e=>{await setCover(cid,e.target.files[0]);e.target.value=''};
$('#list').onclick=e=>{
 const li=e.target.closest('li'),a=e.target.dataset.a;if(!li)return;
 if(li.dataset.l!==undefined){
  const id=li.dataset.l;
  if(a==='cov'){cid=id;$('#cf').click()}
  else if(a==='ren')renameList(id);
  else if(a==='del')delList(id);
  else{lv=id;edit=false;render()}
  return;
 }
 if(li.dataset.i===undefined)return;
 const t=inList(lv)[+li.dataset.i];
 a==='del'?delTrack(t):a==='ren'?renameTrack(t):a==='mv'?moveTrack(t):a==='up'?reorder(t,-1):a==='dn'?reorder(t,1):play(t,lv);
};
if('mediaSession' in navigator)for(const [a,f] of [['play',()=>au.play()],['pause',()=>au.pause()],['previoustrack',prev],['nexttrack',next],['seekto',e=>{au.currentTime=e.seekTime}]])try{navigator.mediaSession.setActionHandler(a,f)}catch(x){}

const S='fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const ic=(d,n=24)=>`<svg viewBox="0 0 24 24" width="${n}" height="${n}" fill="currentColor">${d}</svg>`;
const I={
 play:ic('<path d="M8 5v14l11-7z"/>',30),pause:ic('<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>',30),
 pv:ic('<path d="M6 5h2v14H6zM20 5v14L9 12z"/>'),nx:ic('<path d="M16 5h2v14h-2zM4 5v14l11-7z"/>'),
 sh:ic(`<path ${S} d="M3 6h3.5c3 0 4.5 3 6 6s3 6 6 6H21M3 18h3.5c1.5 0 2.7-.8 3.7-2M13.8 8c1-1.2 2.2-2 3.7-2H21M18 3l3 3-3 3M18 15l3 3-3 3"/>`),
 rp:ic(`<path ${S} d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>`)
};
I.r1=I.rp.replace('</svg>','<text x="12" y="15" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor">1</text></svg>');
$('#sh').innerHTML=I.sh;$('#pv').innerHTML=I.pv;$('#nx').innerHTML=I.nx;$('#pp').innerHTML=I.play;

(async()=>{
 try{$('#welcome').hidden=!!localStorage.getItem('tracks-welcome-seen')}catch(x){$('#welcome').hidden=false}
 if(!$('#welcome').hidden)$('#welcomeStart').focus();
 db=await open();await load();
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
})();
</script>
